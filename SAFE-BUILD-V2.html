</style></head><body><aside><h2>◈ SAFE-BUILD <span style="color:#8fd2a9">V2</span></h2><small>Occupational safety intelligence</small><nav id="nav"></nav><small>Research prototype · Local workspace</small></aside><main><header><strong>Safety Operations / Research</strong><select id="workspace" onchange="switchSpace(this.value)"><option value="demo">Demo workspace</option><option value="blank">Blank workspace</option></select><select id="project" onchange="scope=this.value;lastForecast=lastScenario=lastPlan=null;report='';render()"></select><select id="role" onchange="role=this.value;render()"><option>Analyst</option><option>Safety reviewer</option><option>Site supervisor</option><option>Executive</option></select></header><section id="screen"></section></main><script>
'use strict';const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=x=>Number(x),fmt=x=>Number.isFinite(x)?x.toLocaleString('en-US',{maximumFractionDigits:2}):'N/A',money=x=>'$'+fmt(x),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),now=()=>new Date().toISOString(),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);const sources=[['OSHA data','https://www.osha.gov/data','File download'],['BLS IIF','https://www.bls.gov/iif/','File download / API candidate'],['NOAA NWS','https://www.weather.gov/documentation/services-web-api','API candidate'],['NOAA NCEI','https://www.ncei.noaa.gov/access/search/documentation/data-service/','API candidate'],['EPA ENERGY STAR','https://www.energystar.gov/buildings','Public benchmark'],['NIOSH hierarchy','https://www.cdc.gov/niosh/hierarchy-of-controls/about/index.html','Reference'],['OSHA construction standards','https://www.osha.gov/laws-regs/regulations/standardnumber/1926','Reference'],['Groq','https://console.groq.com/docs/','Server gateway required']];
const names=['Executive dashboard','Data integration hub','Project & site registry','Hazard & exposure studio','Predictive safety engine','Weather & scenario lab','Control optimization','Sustainability analytics','Action & review center','Groq AI copilot','Governance & audit','Reports & validation'];let page=0,space='demo',scope='all',role='Analyst',lastForecast=null,lastScenario=null,lastPlan=null,report='';function seed(blank=false){let projects=blank?[]:['Cedar Green Office','Harbor Transit Annex','Summit Learning Center','Riverbend Retrofit'].map((name,i)=>({id:'P'+(i+1),name,location:['Austin, TX','Seattle, WA','Charlotte, NC','Denver, CO'][i],phase:['Structural','Excavation','Envelope','Mechanical'][i],target:80}));let hazards=[],obs=[],env=[];projects.forEach((p,i)=>{['Falls','Heat exposure','Struck-by','Electrical','Dust exposure'].forEach((name,j)=>hazards.push({id:p.id+'H'+j,p:p.id,name,task:['Roofing','Outdoor shift','Material handling','Installation','Cutting'][j],likelihood:2+(i+j)%3,severity:3+j%3,mandatory:true}));for(let m=1;m<=12;m++){obs.push({id:p.id+'O'+m,p:p.id,period:'2025-'+String(m).padStart(2,'0'),hours:9000+i*1000+m*130,cases:(m+i)%5===0?2:(m+i)%3===0?1:0,dart:(m+i)%5===0?1:0,near:2+(m+i)%7});env.push({id:p.id+'E'+m,p:p.id,period:'2025-'+String(m).padStart(2,'0'),energy:14000+m*500+i*1000,water:21000+m*400,waste:10+m%5,diverted:7+m%3})}});return{projects,hazards,obs,env,controls:blank?[]:[{id:'C1',name:'Required protection package (illustrative)',type:'Engineering',mandatory:true,cost:4500,staff:8,effect:0.2},{id:'C2',name:'Required inspection package (illustrative)',type:'Administrative',mandatory:true,cost:1200,staff:6,effect:0.1},{id:'C3',name:'Additional engineering isolation',type:'Engineering',mandatory:false,cost:3500,staff:5,effect:.25},{id:'C4',name:'Additional exposure monitoring',type:'Administrative',mandatory:false,cost:1800,staff:4,effect:.12},{id:'C5',name:'Additional task redesign',type:'Elimination',mandatory:false,cost:5200,staff:7,effect:.35}],actions:[],runs:[],reviews:[],audit:[],datasets:blank?[]:[{id:'FIX-001',name:'Synthetic monthly exposure fixture',mode:'SYNTHETIC',rows:obs.length,date:now(),hash:'seed-v1'}],model:{version:1,method:'Historical rate',notes:'Illustrative exposure-matched baseline'}}}function load(){try{return JSON.parse(localStorage.getItem('safebuild-v2-'+space))||seed(space==='blank')}catch{return seed(space==='blank')}}let db=load();function save(event){if(event)db.audit.unshift({id:id(),date:now(),role,event});try{localStorage.setItem('safebuild-v2-'+space,JSON.stringify(db))}catch(e){alert('Local storage unavailable: '+e.message)}}function switchSpace(v){space=v;db=load();scope='all';lastForecast=lastScenario=lastPlan=null;report='';render()}function navigate(i){page=i;render()}function selectRows(a){return a.filter(x=>scope==='all'||x.p===scope)}function pname(p){return db.projects.find(x=>x.id===p)?.name||p}function table(head,rows){return `<div class="scroll"><table><thead><tr>${head.map(x=>'<th>'+esc(x)+'</th>').join('')}</tr></thead><tbody>${rows.length?rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join(''):`<tr><td colspan="${head.length}" class="empty">No records in this scope.</td></tr>`}</tbody></table></div>`}function card(t,b){return `<div class="card"><h2>${t}</h2>${b}</div>`}function metric(t,v,n=''){return `<div class="card"><div class="muted">${t}</div><div class="metric">${v}</div><div class="muted">${n}</div></div>`}function button(t,fn,style=''){return `<button class="btn ${style}" onclick="${fn}">${t}</button>`}function opts(){return db.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}function field(n,t='text',v='',extra=''){return `<label>${n}<input name="${n}" type="${t}" value="${esc(v)}" ${extra} required></label>`}function form(fn,b){return `<form onsubmit="event.preventDefault();${fn}(Object.fromEntries(new FormData(this)));">${b}<button class="btn" type="submit">Save</button></form>`}function projfield(){return `<label>Project<select name="p" required>${opts()}</select></label>`}function chart(rows){let mx=Math.max(1,...rows.map(x=>x[1]));return `<div class="chart">${rows.map(([l,v])=>`<div class="colbar"><span>${fmt(v)}</span><i style="height:${Math.max(1,v/mx*78)}%"></i><span>${esc(l)}</span></div>`).join('')}</div>`}function rate(c,h){return h>0?200000*c/h:NaN}function aggregate(a){return {h:sum(a,x=>x.hours),c:sum(a,x=>x.cases),d:sum(a,x=>x.dart),n:sum(a,x=>x.near)}}function addProject(f){db.projects.push({id:id(),name:f.Name,location:f.Location,phase:f.Phase,target:80});save('Project created: '+f.Name);render()}function addHazard(f){if(!f.p)return alert('Create a project first');db.hazards.push({id:id(),p:f.p,name:f.Hazard,task:f.Task,likelihood:num(f.Likelihood),severity:num(f.Severity),mandatory:true});save('Hazard registered');render()}function addObs(f){let a={id:id(),p:f.p,period:f.Period,hours:num(f.Hours),cases:num(f.Recordable),dart:num(f.DART),near:num(f['Near misses'])};if(!a.p||a.dart>a.cases||a.hours<=0)return alert('Require project, positive hours and DART ≤ recordables');db.obs.push(a);save('Synthetic observation added');render()}function addEnv(f){let a={id:id(),p:f.p,period:f.Period,energy:num(f['Energy kWh']),water:num(f['Water gal']),waste:num(f['Waste tons']),diverted:num(f['Diverted tons'])};if(!a.p||a.diverted>a.waste)return alert('Check project and waste totals');db.env.push(a);save('Environmental observation added');render()}
function download(name,data,type='application/json'){let u=URL.createObjectURL(new Blob([data],{type}));let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function csv(a){if(!a.length)return '';let k=Object.keys(a[0]);return [k.join(','),...a.map(r=>k.map(x=>'"'+String(r[x]??'').replace(/"/g,'""')+'"').join(','))].join('\n')}async function importFile(){let f=$('file').files[0];if(!f)return alert('Choose a JSON file');try{let text=await f.text(),a=JSON.parse(text);if(!Array.isArray(a)||!a.length)throw Error('Expected nonempty array');let rows=a.map(x=>{if(!db.projects.some(p=>p.id===x.p)||!/^\d{4}-(0[1-9]|1[0-2])$/.test(x.period)||!['hours','cases','dart','near'].every(k=>typeof x[k]==='number'&&Number.isFinite(x[k])&&x[k]>=0)||x.hours<=0||x.dart>x.cases||!['cases','dart','near'].every(k=>Number.isInteger(x[k])))throw Error('Invalid project, period, hours or counts');return {id:id(),p:x.p,period:x.period,hours:x.hours,cases:x.cases,dart:x.dart,near:x.near}});let keys=new Set(db.obs.map(x=>x.p+'|'+x.period));for(let x of rows){let k=x.p+'|'+x.period;if(keys.has(k))throw Error('Duplicate project/month');keys.add(k)}let hash='';if(crypto.subtle)hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)))).map(x=>x.toString(16).padStart(2,'0')).join('');db.obs.push(...rows);db.datasets.push({id:id(),name:f.name,mode:'SYNTHETIC',rows:rows.length,date:now(),hash:hash||'Unavailable'});save('Imported '+rows.length+' synthetic observations');render()}catch(e){alert(e.message)}}
function runForecast(f){let a=selectRows(db.obs),g=aggregate(a),hours=num(f.Hours);if(!g.h)return alert('Add exposure observations first');let mu=g.c/g.h*hours;let lower=Math.max(0,mu-1.645*Math.sqrt(mu)),upper=mu+1.645*Math.sqrt(mu);lastForecast={id:id(),kind:'Forecast',scope,version:db.model.version,date:now(),hours,mu,lower,upper,inputs:a.map(x=>({...x})),note:'Illustrative normal approximation, not calibrated'};db.runs.unshift(lastForecast);save('Historical-rate forecast generated');render()}
function runScenario(f){let g=aggregate(selectRows(db.obs));if(!g.h)return alert('Add exposure observations first');let hours=num(f.Hours),factor=num(f.Multiplier),seed=num(f.Seed)>>>0;let mu=g.c/g.h*hours*factor; if(mu>1000)return alert('Reduce scenario expected count to 1000 or less');let state=seed||1;function rnd(){state=(Math.imul(1664525,state)+1013904223)>>>0;return(state+1)/4294967297}function poisson(l){let total=0;while(l>0){let z=Math.min(l,20),p=1,k=0,L=Math.exp(-z);do{k++;p*=rnd()}while(p>L);total+=k-1;l-=z}return total}let samples=Array.from({length:2000},()=>poisson(mu)).sort((a,b)=>a-b);lastScenario={id:id(),kind:'Scenario',scope,date:now(),version:db.model.version,hours,factor,seed,weather:f.Weather,mu,p50:samples[999],p80:samples[1599],p95:samples[1899],counts:Array.from({length:10},(_,i)=>[i,samples.filter(x=>i===9?x>=9:x===i).length]),inputs:selectRows(db.obs).map(x=>({...x}))};db.runs.unshift(lastScenario);save('Seeded scenario executed');render()}
function addControl(f){db.controls.push({id:id(),name:f.Control,type:f.Hierarchy,mandatory:f.Required==='Yes',cost:num(f.Cost),staff:num(f['Staff hours']),effect:num(f['Illustrative reduction'])/100});save('Control candidate added');render()}function optimize(f){let a=db.controls,budget=num(f.Budget),staff=num(f['Staff capacity']),g=aggregate(selectRows(db.obs));if(!a.length||!a.some(x=>x.mandatory)||!g.h)return alert('Add exposure observations and mandatory control candidates first');if(a.length>20)return alert('Prototype supports at most 20 controls');let best=null;for(let m=0;m<2**a.length;m++){let s=a.filter((_,i)=>m&(1<<i));if(a.some(x=>x.mandatory&&!s.includes(x)))continue;let c=sum(s,x=>x.cost),h=sum(s,x=>x.staff);if(c>budget||h>staff)continue;let r=s.reduce((v,x)=>v*(1-x.effect),1);if(!best||r<best.residual-1e-9||(Math.abs(r-best.residual)<1e-9&&c<best.cost))best={selected:s.map(x=>({...x})),cost:c,staff:h,residual:r}}lastPlan={id:id(),kind:'Optimization',date:now(),scope,version:db.model.version,budget,capacity:staff,feasible:!!best,...best,inputs:a.map(x=>({...x}))};db.runs.unshift(lastPlan);save(best?'Illustrative control bundle generated':'Infeasible constraints; escalation required');render()}function submitPlan(){if(!lastPlan?.feasible)return;if(db.reviews.some(x=>x.run===lastPlan.id))return alert('This run has already been submitted');db.reviews.unshift({id:id(),run:lastPlan.id,scope:lastPlan.scope,status:'Submitted',note:'',date:now()});save('Control plan submitted for independent review');navigate(8)}function review(rid,status){if(role!=='Safety reviewer')return alert('Switch to simulated Safety reviewer role');let r=db.reviews.find(x=>x.id===rid),note=prompt('Enter review rationale (simulation only)');if(!note?.trim())return;r.status=status;r.note=note;r.date=now();if(status==='Approved for simulation'){let run=db.runs.find(x=>x.id===r.run);run.selected.forEach(c=>db.actions.push({id:id(),name:c.name,p:r.scope,owner:'Unassigned',due:'',status:'Open',review:r.id,evidence:''}))}save('Review '+status);render()}function actionEdit(aid){let a=db.actions.find(x=>x.id===aid);let owner=prompt('Responsible role (not worker name)',a.owner);if(owner===null)return;let due=prompt('Due date YYYY-MM-DD',a.due);if(due===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(due))return alert('Enter valid date format');a.owner=owner;a.due=due;save('Action assigned');render()}function verify(aid){if(role!=='Safety reviewer')return alert('Reviewer role required');let a=db.actions.find(x=>x.id===aid),e=prompt('Synthetic closure evidence reference');if(!e?.trim())return;a.evidence=e;a.status='Verified (simulation)';save('Simulated control closure verified');render()}function reopen(aid){if(role!=='Safety reviewer')return alert('Reviewer role required');db.actions.find(x=>x.id===aid).status='Open';save('Control reopened');render()}
function render(){ $('workspace').value=space;$('project').innerHTML='<option value="all">All projects</option>'+opts();$('project').value=scope;$('role').value=role;$('nav').innerHTML=names.map((n,i)=>([0,1,4,6,8,9].includes(i)?`<label>${({0:'COMMAND CENTER',1:'01 · MODEL',4:'02 · PREDICT',6:'03 · OPTIMIZE',8:'04 · DELIVER',9:'GOVERNANCE & INTELLIGENCE'})[i]}</label>`:'')+`<button class="${page===i?'active':''}" onclick="navigate(${i})">${String(i+1).padStart(2,'0')} &nbsp; ${n}</button>`).join('');let a=selectRows(db.obs),g=aggregate(a),hz=selectRows(db.hazards),env=selectRows(db.env),acts=db.actions.filter(x=>scope==='all'||x.p===scope||x.p==='all'),body='';let prefix=`<div class="banner">SYNTHETIC RESEARCH / ${space==='demo'?'DEMO':'BLANK'} WORKSPACE · Not live safety monitoring, work clearance or a substitute for qualified safety personnel. For actual emergencies follow site procedures and contact emergency services.</div><h1>${names[page]}</h1><p class="muted">${scope==='all'?'Portfolio scope':esc(pname(scope))} · Model v${db.model.version} · Local data · ${a.length} exposure observations · ${fmt(g.h)} worker-hours</p>`;switch(page){
case 0:body=`<div class="flow">${['MODEL','PREDICT','OPTIMIZE','DELIVER'].map((s,i)=>`<button onclick="navigate(${[3,4,6,8][i]})"><small>0${i+1}</small><br><b>${s}</b></button>`).join('')}</div><div class="grid">${metric('Recordable incidence (TRIR)',fmt(rate(g.c,g.h)),'Per 200,000 hours')}${metric('DART rate',fmt(rate(g.d,g.h)),'Per 200,000 hours')}${metric('Exposure hours',fmt(g.h),'Synthetic observation totals')}${metric('Open control actions',acts.filter(x=>x.status==='Open').length,'Requires human review')}${metric('Near-miss reports',g.n,'Reporting volume, not severity')}${metric('Waste diversion',sum(env,x=>x.waste)>0?fmt(100*sum(env,x=>x.diverted)/sum(env,x=>x.waste))+'%':'N/A','Independent sustainability KPI')}</div><div class="two">${card('Monthly recordable observations',chart(Array.from(new Set(a.map(x=>x.period))).sort().slice(-12).map(t=>[t.slice(5),sum(a.filter(x=>x.period===t),x=>x.cases)])))}${card('Site portfolio',table(['Project','Phase','Hours','TRIR'],db.projects.filter(x=>scope==='all'||x.id===scope).map(p=>{let q=aggregate(db.obs.filter(x=>x.p===p.id));return [esc(p.name),esc(p.phase),fmt(q.h),fmt(rate(q.c,q.h))]})))}</div>${card('Safety review signals',`<p>${hz.filter(x=>x.likelihood*x.severity>=12).length} illustrative high-priority hazard ratings. Ratings are ordinal, not incident probabilities.</p><p>${db.reviews.filter(x=>x.status==='Submitted').length} plans awaiting review.</p>${button('Open action center','navigate(8)')}`)}`;break;
case 1:body=card('Source catalog',table(['Authority','Access','Status'],sources.map(x=>[`<a href="${x[1]}" target="_blank" rel="noopener">${x[0]}</a>`,x[2],'<span class="tag warn">Not connected</span>'])))+`<div class="two">${card('Import synthetic exposure data',`<p class="muted">JSON array of aggregate observations, e.g. {"p":"P1","period":"2026-01","hours":8000,"cases":1,"dart":0,"near":4}. No personal or restricted information. Import rejects duplicates, invalid denominators and missing values.</p><input type="file" accept=".json" id="file"><div class="toolbar">${button('Validate & import','importFile()')}${button('Export fixture','download(\'exposure.json\',JSON.stringify(selectRows(db.obs),null,2))','secondary')}</div>`)}${card('Dataset snapshots',table(['Dataset','Rows','Date','Hash'],db.datasets.map(x=>[esc(x.name),x.rows,esc(x.date.slice(0,10)),esc(x.hash.slice(0,16))])))}</div>`;break;
case 2:body=card('Register a fictional project',form('addProject',field('Name')+field('Location')+`<label>Phase<select name="Phase"><option>Excavation</option><option>Structural</option><option>Envelope</option><option>Mechanical</option><option>Commissioning</option></select></label>`))+`<div style="height:15px"></div>`+card('Project registry',table(['ID','Project','Location','Phase','Explore'],db.projects.map(x=>[esc(x.id),esc(x.name),esc(x.location),esc(x.phase),button('Open',`scope='${x.id}';lastForecast=lastScenario=lastPlan=null;report='';navigate(3)`,'secondary')])));break;
case 3:body=card('Register a synthetic hazard',form('addHazard',projfield()+field('Hazard')+field('Task')+field('Likelihood','number',3,'min="1" max="5"')+field('Severity','number',4,'min="1" max="5"')))+`<div class="two">${card('Ordinal hazard matrix',`<table><tr><th>Severity / likelihood</th>${[1,2,3,4,5].map(i=>'<th>'+i+'</th>').join('')}</tr>${[5,4,3,2,1].map(s=>`<tr><th>${s}</th>${[1,2,3,4,5].map(l=>`<td style="background:${s*l>=12?'#f7d9d3':s*l>=6?'#fff0ca':'#dceee3'};text-align:center">${hz.filter(x=>x.severity===s&&x.likelihood===l).length}</td>`).join('')}</tr>`).join('')}</table><p class="muted">Ordinal research ratings only; not probability estimates or clearance criteria.</p>`)}${card('Add exposure observation',form('addObs',projfield()+field('Period','month','2026-01')+field('Hours','number',8000,'min="1"')+field('Recordable','number',0,'min="0"')+field('DART','number',0,'min="0"')+field('Near misses','number',0,'min="0"')))}</div>`+card('Hazard register',table(['Project','Task','Hazard','Likelihood','Severity','Rating'],hz.map(x=>[esc(pname(x.p)),esc(x.task),esc(x.name),x.likelihood,x.severity,`<span class="tag ${x.likelihood*x.severity>=12?'bad':''}">${x.likelihood*x.severity}</span>`])));break;
case 4:body=card('Historical exposure-rate forecast',`<p>Expected count = historical recordable events / worker-hours × future hours. The illustrative interval uses a normal approximation to a Poisson count, not a calibrated site prediction.</p>${form('runForecast',field('Hours','number',10000,'min="1" max="100000000"'))}`)+(lastForecast?`<div class="grid">${metric('Expected count',fmt(lastForecast.mu))}${metric('Illustrative lower',fmt(lastForecast.lower))}${metric('Illustrative upper',fmt(lastForecast.upper))}</div>${card('Run provenance',`<p>Run ${lastForecast.id} · model v${lastForecast.version} · ${lastForecast.inputs.length} observation snapshots</p><p class="muted">${lastForecast.note}</p>`)}`:'')+card('Saved forecast history',table(['Run','Model','Expected','Scope'],db.runs.filter(x=>x.kind==='Forecast').map(x=>[x.id,x.version,fmt(x.mu),esc(pname(x.scope))])));break;
case 5:body=card('Weather-context stress simulation',`<p>Enter a fictional shift condition and independently assumed multiplier. No automatic heat, wind or weather safety threshold is inferred. Consult actual official alerts and qualified safety staff.</p>${form('runScenario',field('Weather','text','Illustrative high heat')+field('Hours','number',10000,'min="1" max="10000000"')+field('Multiplier','number',1.5,'min="0" max="10" step="0.1"')+field('Seed','number',42,'min="1" max="4294967295"'))}<p><a href="https://www.weather.gov/" target="_blank" rel="noopener">Official NWS weather and alerts</a></p>`)+(lastScenario?`<div class="grid">${metric('Expected count',fmt(lastScenario.mu))}${metric('P50',lastScenario.p50)}${metric('P80',lastScenario.p80)}${metric('P95',lastScenario.p95)}</div>${card('Simulated recordable counts · 2,000 samples',chart(lastScenario.counts.map(([i,v])=>[i===9?'9+':i,v])))}`:'')+card('Scenario archive',table(['Run','Weather assumption','Multiplier','P95','Seed'],db.runs.filter(x=>x.kind==='Scenario').map(x=>[x.id,esc(x.weather),x.factor,x.p95,x.seed])));break;
case 6:body=card('Control candidate library',`<p class="muted">These are illustrative packages, not a determination of applicable legal controls. Required controls are non-negotiable in this solver. Effect assumptions are hypothetical and multiplicative.</p>${table(['Control','Hierarchy','Required','Cost','Staff hours','Assumed reduction'],db.controls.map(x=>[esc(x.name),esc(x.type),x.mandatory?'Yes':'No',money(x.cost),x.staff,fmt(x.effect*100)+'%']))}<h2 style="margin-top:20px">Add candidate</h2>${form('addControl',field('Control')+`<label>Hierarchy<select name="Hierarchy">${['Elimination','Substitution','Engineering','Administrative','PPE'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Required<select name="Required"><option>Yes</option><option>No</option></select></label>`+field('Cost','number',1000,'min="0"')+field('Staff hours','number',4,'min="0"')+field('Illustrative reduction','number',10,'min="0" max="100"'))}`)+`<div style="height:15px"></div>`+card('Constrained control selection',form('optimize',field('Budget','number',12000,'min="0"')+field('Staff capacity','number',25,'min="0"')))+(lastPlan?card('Solver result',lastPlan.feasible?`<div class="grid">${metric('Bundle cost',money(lastPlan.cost))}${metric('Staff hours',fmt(lastPlan.staff))}${metric('Residual risk index',fmt(lastPlan.residual*100),'Baseline index = 100')}</div>${table(['Selected candidate','Required'],lastPlan.selected.map(x=>[esc(x.name),x.mandatory?'Yes':'No']))}<div class="toolbar">${button('Submit for simulation review','submitPlan()')}</div>`:`<p class="dangertext">INFEASIBLE — Mandatory controls cannot fit the supplied budget or staff capacity. Escalate to qualified safety personnel; do not relax protections. This is not a work authorization.</p>`):'');break;
case 7:body=`<div class="grid">${metric('Energy (kWh)',fmt(sum(env,x=>x.energy)))}${metric('Water (gal)',fmt(sum(env,x=>x.water)))}${metric('Waste (tons)',fmt(sum(env,x=>x.waste)))}${metric('Diverted (tons)',fmt(sum(env,x=>x.diverted)))}</div>`+card('Record environmental observation',form('addEnv',projfield()+field('Period','month','2026-01')+field('Energy kWh','number',10000,'min="0"')+field('Water gal','number',20000,'min="0"')+field('Waste tons','number',10,'min="0"')+field('Diverted tons','number',8,'min="0"')))+`<div class="two">${card('Energy trend',chart(Array.from(new Set(env.map(x=>x.period))).sort().slice(-12).map(t=>[t.slice(5),sum(env.filter(x=>x.period===t),x=>x.energy)])))}${card('Environmental register',table(['Project','Month','kWh','Water gal','Waste tons','Diverted'],env.map(x=>[esc(pname(x.p)),esc(x.period),fmt(x.energy),fmt(x.water),fmt(x.waste),fmt(x.diverted)])))}</div><p class="muted">Environmental indicators are separate from injury labels and do not establish green-building certification.</p>`;break;
case 8:body=card('Review queue',table(['Run','Status','Rationale','Review'],db.reviews.map(x=>[esc(x.run),esc(x.status),esc(x.note),x.status==='Submitted'&&role==='Safety reviewer'?button('Approve simulated plan',`review('${x.id}','Approved for simulation')`)+ ' '+button('Request changes',`review('${x.id}','Changes requested')`,'secondary'):'—'])))+`<div style="height:15px"></div>`+card('Control action tracker',table(['Control','Owner role','Due','State','Evidence','Actions'],acts.map(x=>[esc(x.name),esc(x.owner),esc(x.due),esc(x.status),esc(x.evidence),button('Assign',`actionEdit('${x.id}')`,'secondary')+' '+(role==='Safety reviewer'?(x.status==='Open'?button('Verify',`verify('${x.id}')`):button('Reopen',`reopen('${x.id}')`,'secondary')):'')])))+`<div class="notice">Role switching is simulated. Review and closure are research records only. No action changes real jobsite status or stop-work authority.</div>`;break;
case 9:body=card('SAFE-BUILD advisory assistant',`<p><span class="tag warn">Local deterministic demo · Groq not connected</span></p><p>Choose a topic to generate an explanation grounded in the current synthetic workspace.</p><select id="topic"><option>Exposure and incident rates</option><option>Latest forecast</option><option>Latest scenario</option><option>Latest control optimization</option><option>Safety governance boundaries</option></select><div class="toolbar">${button('Generate explanation','copilot()')}</div><div id="answer" class="notice">Select a topic to begin.</div><p class="muted">External inference requires a secure gateway, approved context and evaluation. No worker-identifiable data is sent.</p>`);break;
case 10:body=card('Model registry',`<p>Version ${db.model.version} · ${esc(db.model.method)}</p><p>${esc(db.model.notes)}</p><div class="toolbar">${button('Register research revision','reviseModel()')}</div><p class="muted">Version registration does not train or validate a model.</p>`)+`<div class="two">${card('Workspace policy',`<p>Mode: synthetic only. No sensitive worker information.</p><p>Role: ${esc(role)} (simulated)</p><p>Browser storage is editable by the device owner and is not secure institutional storage.</p><div class="toolbar">${button('Export workspace','download(\'safe-build-workspace.json\',JSON.stringify(db,null,2))','secondary')}${button('Reset this workspace','resetSpace()','danger')}</div>`)}${card('Audit history',table(['Time','Actor role','Event'],db.audit.map(x=>[esc(x.date.slice(0,19)),esc(x.role),esc(x.event)])))}</div>`;break;
case 11:let ev=backtest(a);body=`<div class="grid">${metric('Holdout observations',ev.n)}${metric('MAE',fmt(ev.mae),'Recordable counts')}${metric('RMSE',fmt(ev.rmse),'Recordable counts')}${metric('Bias',fmt(ev.bias),'Predicted minus observed')}</div>`+card('Chronological baseline backtest',`<p>Train on earliest 75% of distinct months, test on later months using matched exposure denominators. Synthetic results do not demonstrate actual predictive accuracy.</p>${table(['Month','Project','Actual','Predicted'],ev.rows.map(x=>[esc(x.period),esc(pname(x.p)),x.actual,fmt(x.pred)]))}`)+`<div style="height:15px"></div>`+card('Research export center',`<p>Generate a scoped evidence brief. Print / save as PDF uses the browser print dialog.</p><div class="toolbar">${button('Generate brief','makeReport()')}${button('Exposure CSV','download(\'exposure.csv\',csv(selectRows(db.obs)),\'text/csv\')','secondary')}${button('Runs JSON','download(\'runs.json\',JSON.stringify(db.runs.filter(x=>scope===\'all\'||x.scope===scope),null,2))','secondary')}${button('Print / Save PDF','window.print()','secondary')}</div><div id="report" class="notice">${esc(report)||'No brief generated yet.'}</div>`);break;
} $('screen').innerHTML=prefix+body+'<footer>SAFE-BUILD V2.0 · Research demonstrator · MODEL → PREDICT → OPTIMIZE → DELIVER · No agency endorsement or validated outcome claimed.</footer>'}
function backtest(a){let months=[...new Set(a.map(x=>x.period))].sort(),n=Math.floor(months.length*.75),train=a.filter(x=>months.slice(0,n).includes(x.period)),test=a.filter(x=>months.slice(n).includes(x.period)),g=aggregate(train),rows=g.h?test.map(x=>({p:x.p,period:x.period,actual:x.cases,pred:g.c/g.h*x.hours})):[];return {rows,n:rows.length,mae:rows.length?sum(rows,x=>Math.abs(x.pred-x.actual))/rows.length:NaN,rmse:rows.length?Math.sqrt(sum(rows,x=>(x.pred-x.actual)**2)/rows.length):NaN,bias:rows.length?sum(rows,x=>x.pred-x.actual)/rows.length:NaN}}
function copilot(){let t=$('topic').value,g=aggregate(selectRows(db.obs)),r=db.runs.find(x=>x.kind===({'Latest forecast':'Forecast','Latest scenario':'Scenario','Latest control optimization':'Optimization'})[t]&&(scope==='all'||x.scope===scope)),s='';if(t==='Exposure and incident rates')s=`Scope: ${scope}. ${g.h} worker-hours, ${g.c} recordable observations. TRIR ${fmt(rate(g.c,g.h))}; DART ${fmt(rate(g.d,g.h))}. Source: local exposure observations. Near-miss reporting is not proof of changing risk.`;else if(t==='Safety governance boundaries')s='Mandatory controls cannot be removed for cost savings. All real decisions require competent personnel and applicable site procedures. Reference: [NIOSH hierarchy of controls] and [OSHA construction standards] in source catalog.';else if(!r)s='Insufficient evidence: create a saved run in this scope first.';else s=`Run ${r.id}, model version ${r.version}. `+(r.kind==='Forecast'?`Expected count ${fmt(r.mu)}; illustrative interval ${fmt(r.lower)}–${fmt(r.upper)}.`:r.kind==='Scenario'?`Assumed multiplier ${r.factor}, seed ${r.seed}, P95 count ${r.p95}.`:r.feasible?`Selected ${r.selected.length} illustrative candidates; cost ${money(r.cost)}; residual index ${fmt(r.residual*100)}.`:'No feasible bundle under the entered constraints. Escalation required.');$('answer').textContent=s+'\nDemonstration only; not operational advice.';save('Local advisory explanation generated')}
function reviseModel(){let n=prompt('Research revision notes');if(!n?.trim())return;db.model={version:db.model.version+1,method:'Historical rate',notes:n};save('Model revision registered');render()}function resetSpace(){if(!confirm('Reset only this workspace? All its local edits will be lost.'))return;db=seed(space==='blank');lastForecast=lastScenario=lastPlan=null;report='';scope='all';save('Workspace reset');render()}function makeReport(){let g=aggregate(selectRows(db.obs)),e=backtest(selectRows(db.obs));report=`SAFE-BUILD V2.0 | Synthetic research brief\nGenerated: ${now()}\nScope: ${scope==='all'?'Portfolio':pname(scope)}\nExposure: ${g.h} hours | Recordables: ${g.c} | DART: ${g.d}\nTRIR: ${fmt(rate(g.c,g.h))} | DART rate: ${fmt(rate(g.d,g.h))}\nModel version: ${db.model.version}\nHoldout MAE: ${fmt(e.mae)}; RMSE: ${fmt(e.rmse)}\nSource snapshots: ${db.datasets.map(x=>x.id+' / '+x.name+' / '+x.date).join('; ')}\nSaved run IDs: ${db.runs.filter(x=>scope==='all'||x.scope===scope).map(x=>x.id).join(', ')}\nLimitations: synthetic records; illustrative models; no actual safety clearance, certification or measured impact.`;$('report').textContent=report;save('Research brief generated')}
render();
